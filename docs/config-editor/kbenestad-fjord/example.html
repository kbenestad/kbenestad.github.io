<title>Fjord example</title>
<!-- 1. tokens, 2. component styles (also loads ../fonts/), then markup, then 3. behaviour -->
<link rel="stylesheet" href="tokens.css">

<style>html,body{margin:0;height:100%} .k{height:100%} .win.app{height:100%;border:0;border-radius:0;box-shadow:none}</style>
<script>
  // follow the system light/dark setting within the Fjord family
  (function () {
    var m = matchMedia('(prefers-color-scheme: dark)');
    function set() { document.documentElement.dataset.theme = m.matches ? 'fjord-dark' : 'fjord'; }
    set(); m.addEventListener('change', set);
  })();
</script>
</head>

          <button class="btn pri" data-dialog-open="new" data-i18n="folder.new">New folder</button>
          <button class="btn" id="archive" data-i18n="file.archive">Archive file</button>
        </div>
        <div class="list">
            <div class="row" style="background:var(--sel)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/></svg><div class="tt"><div>Contract — Fjordline.pdf</div><div><data data-fmt="number" value="2.4">2.4</data> MB · <data data-fmt="date" value="2026-10-14">2026-10-14</data></div></div></div>
            <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/></svg><div class="tt"><div>Invoice INV-0143.pdf</div><div><data data-fmt="number" value="180">180</data> kB · <data data-fmt="date" value="2026-10-06">2026-10-06</data></div></div></div>

    <div class="dlg-body"><div class="fld"><label for="fname" data-i18n="folder.name">Name</label><input id="fname" class="inp" value="Ærlig talt — Øvre Årdal"></div></div>

<script src="components/bundle.js"></script>
<script>
  // Interface text, by key. In an app this block is the file locales/en.js, loaded with a <script> after bundle.js.
  // To add a language later: copy it to locales/nb.js, translate the values, set <html lang="nb">,
  // and load locales/nb.js after locales/en.js. Untranslated keys keep their English.
  kBenestadFjord.i18n.add({
    "nav.documents": "Documents",
    "nav.invoices": "Invoices",
    "nav.contracts": "Contracts",
    "nav.archive": "Archive",
    "nav.settings": "Settings",
    "app.title": "Files",
    "nav.folders": "Folders",
    "nav.collapse": "Collapse sidebar",
    "nav.show": "Show sidebar",
    "menu.main": "Main menu",
    "files.count": {
      "one": "{count} item",
      "other": "{count} items"
    },
    "folder.new": "New folder",
    "file.archive": "Archive file",
    "settings.formatIntl": "International format",
    "settings.formatScandi": "Scandinavian format",
    "menu.about": "About",
    "action.cancel": "Cancel",
    "action.create": "Create",
    "folder.name": "Name",
    "file.archived": "File moved to Archive",
    "action.undo": "Undo"
  });
</script>
<script>
  var t = kBenestadFjord.i18n.t;
  document.getElementById('count').textContent = t('files.count', { count: 24 });

  // formats: international by default, Scandinavian as a setting (remembered in this browser)
  function renderFormats() {
    document.querySelectorAll('[data-fmt]').forEach(function (el) {
      var kind = el.dataset.fmt, v = el.getAttribute('value');
      el.textContent = kBenestadFjord.format[kind](kind === 'number' ? Number(v) : v);
    });
    var cur = document.documentElement.getAttribute('data-format') || 'intl';
    document.querySelectorAll('[data-set-format]').forEach(function (b) { b.setAttribute('aria-checked', String(b.dataset.setFormat === cur)); });
  }
  function setFormat(f) {
    if (f === 'scandi') document.documentElement.setAttribute('data-format', 'scandi');
    else document.documentElement.removeAttribute('data-format');
    try { localStorage.setItem('fjord-format', f); } catch (e) {}
    renderFormats();
  }
  try { if (localStorage.getItem('fjord-format') === 'scandi') document.documentElement.setAttribute('data-format', 'scandi'); } catch (e) {}
  renderFormats();
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-set-format]');
    if (b) setFormat(b.dataset.setFormat);
  });

  document.getElementById('archive').addEventListener('click', function () {
    kBenestadFjord.toast(t('file.archived'), { action: t('action.undo') });
  });
</script>
</body>
</html>
