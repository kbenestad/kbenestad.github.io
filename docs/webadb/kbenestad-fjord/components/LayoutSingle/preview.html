<script>
/* the dark half follows the family shown: skjaergard → skjaergard-dark, fjord → fjord-dark, and so on */
(function () {
  function sync() {
    var t = document.documentElement.getAttribute('data-theme') || 'skjaergard';
    var dark = /-dark$/.test(t) ? t : t + '-dark';
    document.querySelectorAll('[data-dark-half]').forEach(function (el) { el.setAttribute('data-theme', dark); });
  }
  sync();
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
