<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0">
<div class="k" style="padding:24px;display:flex;flex-direction:column;gap:14px">
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
    <div class="fld"><label for="f1">Client</label><input id="f1" class="inp" value="Fjordline Studio AS"></div>
    <div class="fld"><label for="f2">Due date</label><input id="f2" class="inp focus" value="2026-10-31"></div>
    <div class="fld"><label for="f3">Email</label><input id="f3" class="inp err" value="post@fjordline"><span class="help err">Enter a full email address</span></div>
    <div class="fld"><label for="f4">Currency</label><select id="f4" class="inp"><option>NOK — Norwegian krone</option></select><span class="help">Used on the PDF</span></div>
  </div>
  <div class="fld"><label for="f5">Note</label><textarea id="f5" class="inp">Thank you for the collaboration.</textarea></div>
  <div style="display:flex;gap:24px;align-items:center">
    <label class="chk"><input type="checkbox" checked> Attach PDF</label>
    <label class="chk"><input type="radio" name="fr" checked> Email</label>
    <label class="chk"><input type="radio" name="fr"> Link</label>
    <span class="chk"><span class="sw on"></span> Reminders</span>
  </div>
</div>
<script>/* static preview */</script>
</body></html>
