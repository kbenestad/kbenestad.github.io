# Keeps the debloat list on the live site current. Every night (and on demand from the
# Actions tab) it downloads the newest list from the Universal Android Debloater Next
# Generation project and, if it changed, commits it to docs/webadb/data/uad_lists.json.
# See README.md ("Debloat list") for what this does and how to check it.
name: Update debloat list

on:
  schedule:
    # 23:17 UTC: just after midnight in Europe (winter) and early morning in Bangkok (06:17).
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the newest list
        run: |
          REPO=Universal-Debloater-Alliance/universal-android-debloater-next-generation
          SHA=$(git ls-remote "https://github.com/$REPO" HEAD | cut -f1)
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$SHA/resources/assets/uad_lists.json" -o /tmp/uad_lists.json
          # Refuse to publish anything that is not a believable list.
          node -e "const l = JSON.parse(require('fs').readFileSync('/tmp/uad_lists.json', 'utf8')); if (Object.keys(l).length < 1000) throw new Error('list is too short: ' + Object.keys(l).length)"
          cp /tmp/uad_lists.json docs/webadb/data/uad_lists.json
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Commit if the list changed
        run: |
          if git diff --quiet; then
            echo "The list has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/webadb/data/uad_lists.json
          git commit -m "Update debloat list (UAD-ng ${SHA:0:7})"
          git push
